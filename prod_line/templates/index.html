<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Production Line</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <h1>MES Data from the Shop Floor (Simulated)</h1>

  <div class="image-box">
    <h2>Steel Surface Image Capture</h2>
    <img id="sent-image" src="/api/image/latest" alt="Captured image" />
    <p>
      Sent at: <span id="sent-at">--:--:--</span>
      <span id="sent-status" class="status-badge"></span>
    </p>
  </div>

  <div class="records-box">
    <h2>Production Line Sensor Readings</h2>
    <div class="records-scroll">
      <table class="records-table">
        <thead>
          <tr>
            <th>Time<br />stamp</th>
            <th>Send<br />Status</th>
            <th>Lagging<br />kVarh</th>
            <th>Leading<br />kVarh</th>
            <th>CO2</th>
            <th>Lagging<br />PF</th>
            <th>Leading<br />PF</th>
            <th>NSM</th>
            <th>Load Type</th>
          </tr>
        </thead>
        <tbody id="records-body"></tbody>
      </table>
    </div>
  </div>

  <script src="/static/dashboard.js"></script>
</body>
</html>
