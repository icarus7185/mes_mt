<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>prod_line</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <h1>Ảnh chụp từ camera (giả lập)</h1>

  <div class="image-box">
    <h2>Ảnh vừa gửi tới Center</h2>
    <img id="sent-image" src="/api/image/latest" alt="Sent image" />
    <p>Thời gian đã gửi: <span id="sent-at">--:--:--</span></p>
  </div>

  <div class="records-box">
    <h2>Dữ liệu vừa gửi tới Analyst</h2>
    <div class="records-scroll">
      <table class="records-table">
        <thead>
          <tr>
            <th>Lagging kVarh</th>
            <th>Leading kVarh</th>
            <th>CO2</th>
            <th>Lagging PF</th>
            <th>Leading PF</th>
            <th>NSM</th>
            <th>Load Type</th>
          </tr>
        </thead>
        <tbody id="records-body"></tbody>
      </table>
    </div>
  </div>

  <script src="/static/dashboard.js"></script>
</body>
</html>
