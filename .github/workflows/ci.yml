name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      # ultralytics pulls in torch; the CPU-only index avoids downloading
      # several GB of CUDA wheels the runner cannot use.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
          pip install pytest

      - name: Compile sources
        run: python -m compileall -q prod_line asst monitor

      # Services use paths relative to the repo root, so run from there.
      # Importing the apps does not start the background loops or download
      # the YOLO model (both happen in lifespan), so no network is needed.
      - name: Import FastAPI apps
        run: |
          python -c "import prod_line.main, asst.main, monitor.main; print('All apps imported')"

      - name: Run tests
        run: |
          set +e
          python -m pytest -q
          code=$?
          if [ "$code" -eq 5 ]; then
            echo "::warning::No tests were collected."
            exit 0
          fi
          exit "$code"
